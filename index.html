<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="tituloPrincipal">Cadastro de Alunos</h1>
    <div class="container">
        <p>Insira o nome do aluno para adicionar à lista:</p>
        <input type="text" id="nomeAluno" placeholder="Nome do aluno">
        <button id="btnAdicionar">Adicionar Aluno</button>
        <ul id="listaAlunos">
            <li>Exemplo: João Xpestein, Xin Jing Pig</li>
        </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
