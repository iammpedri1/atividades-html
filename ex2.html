<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p color: red;>A máquina está DESLIGADA</p>
    <button id="switch">Ligar | Desligar</button>
    <script>
        const botao = document.getElementById('switch');
        const mensagem = document.querySelector('p');
        let ligado = false;
        botao.addEventListener('click', function(){
            if(ligado){
                mensagem.textContent = 'A máquina está Desligada';
                ligado = false;
            } else {
                mensagem.textContent = 'A máquina está Ligada';
                ligado = true;  
            }
        })
    </script>
</body>
</html>
