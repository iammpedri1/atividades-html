<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cumprimento Simples</title>
</head>
<body>
    <input type="text" id="campoNome" placeholder="Digite seu nome">
    <button id="btn">Cumprimentar</button>
    <p id="resposta"></p>
    <script>
        let botao = document.getElementById("btn");
        botao.onclick = function() {
            let nome = document.getElementById("campoNome").value;
            document.getElementById("resposta").innerHTML = "Seja bem-vindo(a), " + nome + "!";
        };
    </script>

</body>
</html>
